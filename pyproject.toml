[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hamed Hani", email = "honeyhamed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.55.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
documind = "documind:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
